[package]
name = "tc_skein"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Skein 1.3 hash function over Threefish, keyed or personalised, with any state and output size."
readme = "README.md"
documentation = "https://docs.rs/tc_skein"
keywords = ["skein", "threefish", "hash", "digest", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = []
# SkeinParamsOwned, which owns its inputs and wipes them through tc_zeroize.
alloc = ["tc_zeroize/alloc"]

[dependencies]
tc_block_cipher = "0.1.0"
tc_digest = { version = "0.1.0", path = "../tc_digest" }
tc_threefish = "0.1.0"
tc_zeroize = "0.1.0"

[package.metadata.docs.rs]
all-features = true
