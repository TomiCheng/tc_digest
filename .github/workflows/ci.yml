name: CI

# CI runs on pull requests only. Pushes are not tested, including merges and
# direct commits to develop; the develop-to-main pull request tests those.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-14
            host: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install native toolchain
        run: |
          rustup toolchain install stable-${{ matrix.host }} --profile minimal
          rustup default stable-${{ matrix.host }}
          rustc -vV
          rustc -vV | grep -Fx 'host: ${{ matrix.host }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  x86:
    name: Native execution / Linux i686
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit compiler and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target i686-unknown-linux-gnu
      - run: cargo test --locked --all-features --target i686-unknown-linux-gnu

  msrv:
    name: MSRV / Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
      # The first-party dependencies require 1.85, and the only third-party
      # ones, the blake3 crate and its dependencies behind tc_blake's blake3
      # feature, build on 1.85, so Rust 1.85 covers every build, tests included.
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 test --locked --all-features

  quality:
    name: Format, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      # Each digest crate keeps a private copy of the Merkle-Damgard buffer;
      # the copies must not drift apart.
      - name: Check the MdBuffer copies are identical
        run: |
          cmp tc_md/src/md_buffer.rs tc_dstu7564/src/md_buffer.rs
          cmp tc_md/src/md_buffer.rs tc_sha/src/md_buffer.rs
          cmp tc_md/src/md_buffer.rs tc_ripemd/src/md_buffer.rs
          cmp tc_md/src/md_buffer.rs tc_sm3/src/md_buffer.rs
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-only
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      # Packaged together so the digest crates are verified against this
      # tc_digest, not the release on crates.io.
      - run: cargo package --locked -p tc_ascon_hash -p tc_blake -p tc_digest -p tc_dstu7564 -p tc_gost3411 -p tc_keccak -p tc_md -p tc_ripemd -p tc_sha -p tc_sm3
        env:
          # Keep unpacked package manifests outside rust-cache's build tree.
          CARGO_TARGET_DIR: ${{ runner.temp }}/package

  portable:
    name: Cross-architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target aarch64-unknown-none
      - run: cargo check --locked --all-features --target wasm32-unknown-unknown
      # tc_blake's blake3 feature builds the blake3 crate's NEON C code on
      # aarch64, which needs a C cross compiler for this bare-metal target;
      # its default build is checked above.
      - run: cargo check --locked --all-features --target aarch64-unknown-none --workspace --exclude tc_blake
      - name: Check default dependency sets
        run: |
          check() {
            expected="$1"; shift
            actual="$(cargo tree --locked --edges normal --prefix none "$@" | cut -d' ' -f1 | sort -u | paste -sd' ')"
            if [ "$actual" != "$expected" ]; then
              echo "cargo tree $*: expected '$expected', got '$actual'" >&2
              exit 1
            fi
          }
          # Only tc_blake has a target-specific dependency, tc_runtime on x86,
          # and its blake3 feature adds the blake3 crate and its dependencies;
          # every other crate resolves the same set on every target, and the
          # legacy feature must not add a dependency.
          for target in aarch64-unknown-none wasm32-unknown-unknown x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
            case "$target" in
              x86_64-*|i686-*)
                blake='tc_blake tc_digest tc_runtime tc_zeroize'
                blake3='arrayvec blake3 cfg-if constant_time_eq cpufeatures tc_blake tc_digest tc_runtime tc_zeroize zeroize'
                ;;
              *)
                blake='tc_blake tc_digest tc_zeroize'
                blake3='arrayvec blake3 cfg-if constant_time_eq tc_blake tc_digest tc_zeroize zeroize'
                ;;
            esac
            check 'tc_ascon_hash tc_digest tc_zeroize' -p tc_ascon_hash --target "$target"
            check 'tc_ascon_hash tc_digest tc_zeroize' -p tc_ascon_hash --all-features --target "$target"
            check "$blake" -p tc_blake --target "$target"
            check "$blake3" -p tc_blake --all-features --target "$target"
            check 'tc_digest' -p tc_digest --target "$target"
            check 'tc_digest tc_zeroize' -p tc_digest --all-features --target "$target"
            check 'tc_digest tc_dstu7564 tc_zeroize' -p tc_dstu7564 --target "$target"
            check 'tc_block_cipher tc_digest tc_gost28147 tc_gost3411 tc_zeroize' -p tc_gost3411 --target "$target"
            check 'tc_digest tc_keccak tc_zeroize' -p tc_keccak --target "$target"
            check 'tc_digest tc_md tc_zeroize' -p tc_md --target "$target"
            check 'tc_digest tc_ripemd tc_zeroize' -p tc_ripemd --target "$target"
            check 'tc_digest tc_sha tc_zeroize' -p tc_sha --target "$target"
            check 'tc_digest tc_sm3 tc_zeroize' -p tc_sm3 --target "$target"
          done
