name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-14
            host: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install native toolchain
        run: |
          rustup toolchain install stable-${{ matrix.host }} --profile minimal
          rustup default stable-${{ matrix.host }}
          rustc -vV
          rustc -vV | grep -Fx 'host: ${{ matrix.host }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked

  x86:
    name: Native execution / Linux i686
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit compiler and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target i686-unknown-linux-gnu

  msrv:
    name: MSRV / Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
      # No crate has a feature or a dependency outside the workspace, so Rust
      # 1.85 covers every build, tests included.
      - run: cargo +1.85.0 test --locked

  quality:
    name: Format, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      # Each digest crate keeps a private copy of the Merkle-Damgard buffer;
      # the copies must not drift apart.
      - name: Check the MdBuffer copies are identical
        run: cmp tc_md/src/md_buffer.rs tc_sha/src/md_buffer.rs
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-only
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
      # Packaged together so tc_md and tc_sha are verified against this
      # tc_digest, not the release on crates.io.
      - run: cargo package --locked -p tc_digest -p tc_md -p tc_sha
        env:
          # Keep unpacked package manifests outside rust-cache's build tree.
          CARGO_TARGET_DIR: ${{ runner.temp }}/package

  portable:
    name: Cross-architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target aarch64-unknown-none
      - name: Check default dependency sets
        run: |
          check() {
            expected="$1"; shift
            actual="$(cargo tree --locked --edges normal --prefix none "$@" | cut -d' ' -f1 | sort -u | paste -sd' ')"
            if [ "$actual" != "$expected" ]; then
              echo "cargo tree $*: expected '$expected', got '$actual'" >&2
              exit 1
            fi
          }
          # No crate has a target-specific dependency, so the x86 targets must
          # resolve the same sets as the portable ones.
          for target in aarch64-unknown-none wasm32-unknown-unknown x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
            check 'tc_digest' -p tc_digest --target "$target"
            check 'tc_digest tc_md' -p tc_md --target "$target"
            check 'tc_digest tc_sha' -p tc_sha --target "$target"
          done
