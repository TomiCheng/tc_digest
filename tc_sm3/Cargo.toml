[package]
name = "tc_sm3"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SM3 message digest (GB/T 32905-2016), the Chinese national hash standard."
readme = "README.md"
documentation = "https://docs.rs/tc_sm3"
keywords = ["sm3", "hash", "digest", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
tc_digest = { version = "0.1.0", path = "../tc_digest" }
tc_zeroize = "0.1.0"
